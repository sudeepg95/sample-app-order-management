name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/code-review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/code-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache Claude Code
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/claude
            ~/.claude
          key: claude-code-${{ runner.os }}-v2

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: '/code-review:code-review'
          claude_args: '--model anthropic/claude-sonnet-4.6 --max-turns 30'
          additional_permissions: 'actions: read'
          show_full_output: "true"
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            code-review@claude-plugins-official
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
